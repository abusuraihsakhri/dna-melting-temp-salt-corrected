name: Dna Melting Temp Salt Corrected CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-ephemeral
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Verify dependency environment and syntax
      run: |
        python -m pip check
        python -m compileall -q agents oligo_tm.py mg2_correction.py multi_primer_comparison.py secondary_structure.py cli.py

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check static browser calculator
      run: node tests/browser_smoke.cjs

    - name: Audit installed Python dependencies
      if: matrix.python-version == '3.12'
      run: |
        python -m pip install pip-audit
        pip-audit --skip-editable

    - name: Audit chain and PHI guard smoke check
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
