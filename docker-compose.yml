version: '3.8'

services:
  dna-melting-temp-salt-corrected:
    build: .
    container_name: dna-melting-temp-salt-corrected
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=dna-melting-temp-salt-corrected-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
