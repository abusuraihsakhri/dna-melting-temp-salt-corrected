[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-melting-temp-salt-corrected"
version = "1.0.0"
description = "DNA melting temperature calculator with salt and Mg2+ corrections"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dna-melting-tm = "oligo_tm:main"
dna-melting-agent = "cli:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["cli", "oligo_tm", "mg2_correction", "secondary_structure", "multi_primer_comparison", "enrichment", "simulator"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_oligo_tm.py"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
